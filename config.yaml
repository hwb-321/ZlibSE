# 压测目标后端地址。
base_url: "http://4070s-linux.xinghen.ip-ddns.com:8000"

# 压测账号生成配置。
accounts:
  # 需要生成的普通测试用户数量。
  user_count: 100
  # 测试用户名统一前缀，脚本会自动补三位序号。
  username_prefix: "bench_user"
  # 测试邮箱统一域名。
  email_domain: "benchmark@local"
  # 测试账号默认密码。
  default_password: "BenchmarkPass123!"

# Locust 压测场景配置。
scenarios:
  # 并发虚拟用户数。
  vus: 100
  # 压测持续时间。
  duration: "30s"
  # 每秒启动多少个新用户。
  spawn_rate: 5
  # 两次请求之间的最小等待时间，单位毫秒。
  wait_time_min_ms: 500
  # 两次请求之间的最大等待时间，单位毫秒。
  wait_time_max_ms: 1500

# 压测初始化书籍与查询参数配置。
books:
  # 列表接口默认页码。
  page: 1
  # 列表接口默认每页数量。
  page_size: 10
  # 搜索接口默认关键字。
  search_query: "python"
  # 每个测试用户初始化多少本压测书籍。
  books_per_user: 5
  # 压测书籍默认分类。
  default_category: "benchmark"
  # 压测书籍默认语言。
  default_language: "zh-CN"
  # 压测书籍默认年份。
  default_year: 2024
  # 是否为每本书同时生成封面文件信息。
  include_cover: true

# 压测结果阈值配置。
thresholds:
  # 可接受的最大错误率。
  max_error_rate: 0.01
  # 可接受的 P95 响应时间上限，单位毫秒。
  p95_ms: 300
