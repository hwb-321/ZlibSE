# 后端服务启动配置。
server:
  # 监听地址。设置为 0.0.0.0 后，可以同时通过 localhost、127.0.0.1、局域网 IP、DDNS 域名访问。
  host: 0.0.0.0
  # 后端 HTTP 服务端口。
  port: 8000
  # 开发环境下是否开启热重载。
  reload: false
  # Uvicorn worker 进程数。压测或生产环境可适当调大；开启 reload 时会自动退回为 1。
  workers: 8
  # 是否打印逐条 HTTP 访问日志。压测时建议关闭，以减少终端输出和日志开销。
  access_log: false

# 安全相关配置。
security:
  # JWT 签名密钥。
  jwt_secret_key: dev-jwt-secret-change-me-please-use-32bytes-min
  # JWT 签名算法。
  jwt_algorithm: HS256
  # Access token 过期天数。
  jwt_access_token_expire_days: 7
  # 是否启用登录/注册验证码。
  captcha_enabled: true

# 数据库配置。
database:
  # 公开模板默认使用本地 SQLite。部署或本地真实环境请改为 MySQL URL。
  sqlite_path: zlibse.db
  # SQLAlchemy 连接池常驻连接数。
  pool_size: 2
  # 常驻连接不够时允许临时创建的额外连接数。
  max_overflow: 2
  # 连接回收时间，单位秒。用于避免长连接失效。
  pool_recycle_seconds: 1800
  # 从连接池获取连接的超时时间，单位秒。
  pool_timeout_seconds: 30

# 压测辅助配置。
benchmark:
  # 是否开启服务端压测 mock。开启后跳过真实上传、真实解析，直接写入默认元数据。
  mock_upload_enabled: false
  # server-mock 下统一返回的固定对象 key，例如存储桶根路径下的 mock.txt。
  mock_file_object_key: mock.txt
  # server-mock 下写入 file_parse_results 的默认作者。
  mock_author: Mock Parser
  # server-mock 下写入 file_parse_results 的默认语言。
  mock_language: zh-CN
  # server-mock 下写入 file_parse_results 的默认页数。
  mock_page_count: 0

# 文件后验异步解析配置。
async_parse:
  # 是否启用上传完成后的异步解析。
  enabled: true
  # 运行模式：off=关闭，on=真实解析。server-mock 下会直接跳过真实解析。
  mode: on
  # 消息队列类型，当前实现使用 RabbitMQ。
  broker: rabbitmq
  # RabbitMQ 连接地址。
  broker_url: amqp://guest:guest@127.0.0.1:5672/%2F
  # 解析任务交换机。
  exchange_name: zlibse.file
  # 解析任务队列。
  queue_name: zlibse.file.parse
  # 解析任务路由键。
  routing_key: parse
  # 解析任务锁与可见窗口 TTL。
  task_ttl_seconds: 3600

# Redis 配置。enabled=false 时会完全回退到数据库/原始逻辑。
redis:
  # 是否启用 Redis 缓存。
  enabled: true
  # Redis 连接地址。
  url: redis://127.0.0.1:6379/0
  # Redis key 前缀。
  prefix: zlibse
  # 默认缓存 TTL，单位秒。
  default_ttl_seconds: 300
  # 书籍列表缓存 TTL。
  book_list_ttl_seconds: 120
  # 书籍搜索缓存 TTL。
  book_search_ttl_seconds: 120
  # 书籍详情缓存 TTL。
  book_detail_ttl_seconds: 300
  # auth_token_version 缓存 TTL。
  auth_token_version_ttl_seconds: 300
  # 用户基础信息缓存 TTL。用于鉴权版本校验通过后直接复用用户 id、用户名和管理员标记。
  user_profile_ttl_seconds: 300
  # 下载元信息缓存 TTL。
  file_meta_ttl_seconds: 300
  # 用户收藏书籍 id 集合缓存 TTL。用于快速判断某本书是否已收藏。
  favorite_set_ttl_seconds: 300
  # 空值缓存 TTL。
  empty_ttl_seconds: 30
  # Redis 锁默认 TTL。
  lock_ttl_seconds: 10
  # 布隆过滤器预估元素个数。
  bloom_expected_items: 10000
  # 布隆过滤器误判率。
  bloom_error_rate: 0.01
  # 进程内布隆过滤器的可信时长，单位秒。未命中且仍在可信窗口内时，可直接拒绝明显非法的 book_id。
  bloom_trusted_ttl_seconds: 10

# 本地缓存配置，用于构建 L1 + Redis 双缓存。
local_cache:
  # 是否启用本地一级缓存。
  # 只有当 redis.enabled=true 且 local_cache.enabled=true 时，才会形成“一级缓存 + Redis + 数据库”三层模式。
  # 如果 redis.enabled=false，则这里即使为 true 也不会单独启用一级缓存，而是直接退回“只有数据库”。
  enabled: true
  # 最大缓存条目数。
  max_entries: 1024
  # 默认 TTL。
  default_ttl_seconds: 30
  # 文件元数据缓存 TTL。
  file_meta_ttl_seconds: 20
  # 本地空值缓存 TTL。
  empty_ttl_seconds: 10

# 搜索配置。
search:
  # 搜索关键字最小长度。默认 1，表示只拦截空字符串，不拦截单字搜索。
  min_query_length: 1
  # 搜索接口默认每页返回条数。
  default_page_size: 10
  # 搜索接口允许的最大每页返回条数。
  max_page_size: 20
  # 是否开启搜索限流保护。开启后会按客户端 IP 在时间窗口内限流，防止搜索请求把数据库打穿。
  rate_limit_enabled: true
  # 搜索限流窗口大小，单位秒。
  rate_limit_window_seconds: 10
  # 搜索限流窗口内允许的最大请求次数。
  rate_limit_max_requests: 30

# 通用分页配置。
pagination:
  # 收藏列表、上传列表、书籍列表等分页接口的默认每页返回条数。
  default_page_size: 10
  # 收藏列表、上传列表、书籍列表等分页接口允许的最大每页返回条数。
  max_page_size: 20

# 调试指标配置。开启后会把请求统计、缓存命中统计、关键分段耗时写入 Redis，
# 并可通过 /debug/metrics 聚合查看。
debug_metrics:
  # 是否开启 Redis 聚合调试指标。
  enabled: true
  # 慢 SQL 阈值，单位毫秒。超过该阈值的 SQL 会额外累计 slow_sql 计数。
  slow_sql_threshold_ms: 100

# 下载签发缓存配置。
download_cache:
  # 是否开启基于滑动窗口热点识别的下载签发 URL Redis 短缓存。
  hot_enabled: true
  # 热点下载签发 URL 的 Redis TTL，单位秒。压测前先预热 file_id 时，可以适当设置长一点。
  hot_signed_url_ttl_seconds: 30
  # 热点访问统计窗口，单位秒。
  hot_window_seconds: 30
  # 窗口内达到该访问次数后，才会为对应 file_id 启用下载链接缓存。
  hot_threshold: 5

# 跨域配置。
cors:
  # 允许访问后端接口的前端来源地址。
  allow_origins:
    - http://localhost:8080
    - http://127.0.0.1:8080
    - http://4070s-linux.xinghen.ip-ddns.com:8080

# 对象存储配置。
storage:
  # 当前存储提供商。当前实现使用腾讯云 COS 的 S3 兼容接口。
  provider: cos
  # 存储桶名称。
  bucket: zlibse-1313357152
  # 存储桶地域。
  region: ap-beijing
  # COS 的 S3 兼容接入点。这里使用 region 级 endpoint，并通过 virtual-hosted-style 访问桶。
  endpoint: https://cos.ap-beijing.myqcloud.com
  # 访问密钥 ID。公开模板留空，真实环境请填写。
  secret_id: ""
  # 访问密钥 Key。公开模板留空，真实环境请填写。
  secret_key: ""
  # 预签名上传链接有效期，单位秒。
  upload_expires: 900
  # 预签名下载链接有效期，单位秒。
  download_expires: 300
  # 正文文件对象 key 前缀。
  book_prefix: books
  # 封面文件对象 key 前缀。
  cover_prefix: covers
