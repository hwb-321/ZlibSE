# 后端服务启动配置。
server:
  # 监听地址。设置为 0.0.0.0 后，可以同时通过 localhost、127.0.0.1、局域网 IP、DDNS 域名访问。
  host: 0.0.0.0
  # 后端 HTTP 服务端口。
  port: 8000
  # 开发环境下是否开启热重载。
  reload: false
  # Uvicorn worker 进程数。压测或生产环境可适当调大；开启 reload 时会自动退回为 1。
  workers: 64
  # 是否打印逐条 HTTP 访问日志。压测时建议关闭，以减少终端输出和日志开销。
  access_log: false

# 安全相关配置。
security:
  # JWT 签名密钥。
  jwt_secret_key: dev-jwt-secret-change-me-please-use-32bytes-min
  # JWT 签名算法。
  jwt_algorithm: HS256
  # Access token 过期天数。
  jwt_access_token_expire_days: 7
  # 是否启用登录/注册验证码。
  captcha_enabled: false

# 数据库配置。
database:
  # SQLite 文件路径。相对路径默认以仓库根目录为基准。
  sqlite_path: zlibse.db

# 压测辅助配置。
benchmark:
  # 是否开启压测文件模拟上传模式。开启后，/api/files/upload-complete 会跳过 COS 对象检查，
  # 直接按请求体中的文件信息落库，便于本地压测时伪造上传成功的书籍文件。
  mock_upload_enabled: true

# Redis 配置。enabled=false 时会完全回退到数据库/原始逻辑。
redis:
  # 是否启用 Redis 缓存。
  enabled: true
  # Redis 连接地址。
  url: redis://127.0.0.1:6379/0
  # Redis key 前缀。
  prefix: zlibse
  # 默认缓存 TTL，单位秒。
  default_ttl_seconds: 300
  # 书籍列表缓存 TTL。
  book_list_ttl_seconds: 120
  # 书籍搜索缓存 TTL。
  book_search_ttl_seconds: 120
  # 书籍详情缓存 TTL。
  book_detail_ttl_seconds: 300
  # token_version 缓存 TTL。
  token_version_ttl_seconds: 300
  # 下载元信息缓存 TTL。
  file_meta_ttl_seconds: 300

# 跨域配置。
cors:
  # 允许访问后端接口的前端来源地址。
  allow_origins:
    - http://localhost:8080
    - http://127.0.0.1:8080
    - http://4070s-linux.xinghen.ip-ddns.com:8080

# 对象存储配置。
storage:
  # 当前存储提供商。当前实现使用腾讯云 COS 的 S3 兼容接口。
  provider: cos
  # 存储桶名称。
  bucket: zlibse-1313357152
  # 存储桶地域。
  region: ap-beijing
  # COS 的 S3 兼容接入点。这里使用 region 级 endpoint，并通过 virtual-hosted-style 访问桶。
  endpoint: https://cos.ap-beijing.myqcloud.com
  # 访问密钥 ID。
  secret_id: AKIDru6CAADWM1oMrGVlJm8NSNCtSr7IQWUT
  # 访问密钥 Key。
  secret_key: qdIl2BAyhEajuBHE0cBi3BKYkIhw0w9D
  # 预签名上传链接有效期，单位秒。
  upload_expires: 900
  # 预签名下载链接有效期，单位秒。
  download_expires: 300
  # 正文文件对象 key 前缀。
  book_prefix: books
  # 封面文件对象 key 前缀。
  cover_prefix: covers
