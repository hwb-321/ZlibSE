<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPUB.js Reader</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: #ddd;
            overflow: hidden;
            /* Prevent scrolling */
        }

        #main-container {
            position: relative;
            width: 100%;
            /* Full width */
            height: 100vh;
            /* Full height of the viewport */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #book {
            width: 100%;
            /* Full width */
            height: calc(100vh - 60px);
            /* Adjust height considering the nav buttons */
            overflow: hidden;
            text-align: justify;
            padding: 10px 60px;
            /* Padding on the sides for nav buttons */
            box-sizing: border-box;
            /* Include padding in width calculation */
        }

        .nav-button {
            position: fixed;
            /* Fixed position for the nav buttons */
            top: 50%;
            /* Center vertically */
            transform: translateY(-50%);
            background-color: #333;
            border: none;
            padding: 10px;
            /* Adjust padding */
            cursor: pointer;
            color: #fff;
            font-size: 1.5em;
            /* Adjust font size */
            z-index: 100;
        }

        #prev {
            left: 10px;
        }

        /* Position the prev button on the left */
        #next {
            right: 10px;
        }

        /* Position the next button on the right */
        #tocBtn {
            position: fixed;
            /* Fixed position for the TOC button */
            top: 10px;
            left: 10px;
            background-color: #333;
            color: #fff;
            padding: 5px 10px;
            /* Smaller padding for the TOC button */
            border: none;
            cursor: pointer;
            font-size: 1.2em;
            /* Adjust font size */
            z-index: 101;
        }

        #toc {
            position: fixed;
            /* Fixed position for the TOC */
            left: 0;
            top: 50px;
            /* Below the TOC button */
            width: 250px;
            /* Width of the TOC */
            height: calc(100vh - 50px);
            /* Height considering the TOC button */
            background: #222;
            overflow-y: auto;
            padding: 10px;
            /* Padding inside the TOC */
            display: none;
            z-index: 100;
        }

        #toc a {
            color: #ddd;
            text-decoration: none;
            display: block;
            padding: 5px;
        }

        #toc a:hover {
            background-color: #333;
        }

        /* Responsive adjustments for smaller screens */
        @media (max-width: 600px) {
            #tocBtn {
                font-size: 1em;
                /* Smaller font size for the TOC button */
                padding: 5px;
                /* Smaller padding */
            }

            .nav-button {
                padding: 5px;
                /* Smaller padding for the nav buttons */
                font-size: 2em;
                /* Larger font size for the nav buttons */
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3/dist/epub.min.js"></script>
</head>

<body>
    <div id="main-container">
        <button id="prev" class="nav-button">‹</button>
        <div id="book"></div>
        <button id="next" class="nav-button">›</button>
    </div>
    <button id="tocBtn">目录</button>
    <div id="toc"></div>
    <script>
        var book = ePub("http://localhost:8000/book/download/57.epub");
        // var book = ePub("https://s3.amazonaws.com/moby-dick/moby-dick.epub");
        var rendition;
        var tocLoaded = false;

        document.addEventListener("DOMContentLoaded", function () {
            rendition = book.renderTo("book", { width: '100%', height: '100%' });
            rendition.display();

            var tocElement = document.getElementById('toc');
            book.loaded.navigation.then(function (navigation) {
                tocElement.innerHTML = navigation.toc.map(function (item) {
                    return '<a href="' + item.href + '">' + item.label + '</a>';
                }).join('');
                tocLoaded = true;
                tocElement.style.display = 'none';
            });
        });

        document.getElementById('tocBtn').addEventListener('click', function () {
            var toc = document.getElementById('toc');
            if (tocLoaded) {
                toc.style.display = toc.style.display === 'none' ? 'block' : 'none';
            }
        });

        document.addEventListener('click', function (e) {
            var toc = document.getElementById('toc');
            if (toc.style.display === 'block' && !toc.contains(e.target) && e.target.id !== 'tocBtn') {
                toc.style.display = 'none';
            }
        });

        document.getElementById('next').addEventListener('click', function () {
            rendition.next();
        });

        document.getElementById('prev').addEventListener('click', function () {
            rendition.prev();
        });

        document.getElementById('toc').addEventListener('click', function (e) {
            if (e.target.tagName === 'A') {
                e.preventDefault();
                rendition.display(e.target.getAttribute('href'));
                toc.style.display = 'none';
            }
        });
    </script>
</body>

</html>
